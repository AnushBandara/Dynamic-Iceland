name: DynamicIsland
options:
  bundleIdPrefix: io.github.anushbandara
  deploymentTarget:
    macOS: "14.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  DynamicIsland:
    type: application
    platform: macOS
    sources:
      - DynamicIsland
      - path: Vendor/mediaremote-adapter/bin/mediaremote-adapter.pl
        buildPhase: resources
    dependencies:
      # Embedded but not linked: only /usr/bin/perl loads it (see NowPlaying.swift)
      - target: MediaRemoteAdapter
        embed: true
        link: false
      - package: Sparkle
    info:
      path: DynamicIsland/Info.plist
      properties:
        CFBundleDisplayName: Dynamic Island
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true # no Dock icon, lives in the menu bar
        NSCalendarsFullAccessUsageDescription: Shows your next meeting in the island.
        NSCameraUsageDescription: Shows a camera mirror in the island when you click it.
        NSDownloadsFolderUsageDescription: Shows an alert in the island when a download finishes.
        NSBluetoothAlwaysUsageDescription: Shows an alert in the island when your headphones connect.
        # Sparkle: releases upload appcast.xml next to the zip (scripts/release.sh)
        SUFeedURL: https://github.com/AnushBandara/Dynamic-Iceland/releases/latest/download/appcast.xml
        SUPublicEDKey: UcGInE0XptcaIUUTw7nZrP1WS2Ao1Qp3T7u68Jrr9C0= # private key: login keychain (generate_keys -x to back up)
        SUEnableAutomaticChecks: true
    entitlements:
      path: DynamicIsland/DynamicIsland.entitlements
      properties:
        com.apple.security.personal-information.calendars: true # hardened runtime blocks EventKit without it
        com.apple.security.device.camera: true # likewise for the camera mirror
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.anushbandara.dynamicisland
        ENABLE_HARDENED_RUNTIME: YES # required for notarization (direct download, no sandbox)
    scheme:
      testTargets: [DynamicIslandTests]

  DynamicIslandTests:
    type: bundle.unit-test
    platform: macOS
    sources: [DynamicIslandTests]
    dependencies:
      - target: DynamicIsland
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  # github.com/ungive/mediaremote-adapter @ 0e82bf1 (BSD-3), built here instead of via CMake
  MediaRemoteAdapter:
    type: framework
    platform: macOS
    sources:
      - path: Vendor/mediaremote-adapter/src
        excludes: ["test/*.m"]
    dependencies:
      - sdk: AppKit.framework
      - sdk: ImageIO.framework
      - sdk: UniformTypeIdentifiers.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.anushbandara.dynamicisland.MediaRemoteAdapter
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Vendor/mediaremote-adapter/src", "$(SRCROOT)/Vendor/mediaremote-adapter/include"]
        CLANG_ENABLE_OBJC_ARC: YES
        GCC_SYMBOLS_PRIVATE_EXTERN: NO # perl looks up adapter_* symbols by name
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES
        DEFINES_MODULE: NO
        SKIP_INSTALL: YES
